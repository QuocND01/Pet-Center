version: "3.1"

# ════════════════════════════════════════════════════════════════════════════
#  RULES — luật cố định (1 intent → 1 hành động). Do SETUP dựng khung.
#  👤 TRAINING: thường không cần sửa file này, chỉ thêm khi có intent mới.
# ════════════════════════════════════════════════════════════════════════════

rules:

# — Cơ bản —
- rule: Chào hỏi
  steps:
    - intent: greet
    - action: utter_greet

- rule: Tạm biệt
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_bot_challenge

- rule: Hỏi khả năng của Bot
  steps:
    - intent: ask_bot_capabilities
    - action: utter_ask_bot_capabilities

- rule: Hỏi gặp tư vấn viên
  steps:
    - intent: ask_human
    - action: utter_ask_human

- rule: Ngoài phạm vi
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: Phản hồi khi affirm mà không có context form
  steps:
    - intent: affirm
    - action: utter_phan_hoi_linh_tinh

# Fix lỗi: deny sau khi bot hỏi xác nhận (tiêu biểu: sau context check của tim_don_hang_theo_san_pham)
# Không có rule này → TEDPolicy predict sai action → bot trả lời lùng (xoa_san_pham...)
- rule: Phản hồi khi deny mà không có context form
  steps:
    - intent: deny
    - action: utter_phan_hoi_linh_tinh

- rule: Fallback khi không hiểu
  steps:
    - intent: nlu_fallback
    - action: action_default_fallback

# — Sản phẩm —
- rule: Xem sản phẩm mới
  steps:
    - intent: xem_san_pham_moi
    - action: action_xem_san_pham_moi

- rule: Xem sản phẩm hot
  steps:
    - intent: xem_san_pham_hot
    - action: action_xem_san_pham_hot

- rule: Xem giỏ hàng
  steps:
    - intent: xem_gio_hang
    - action: action_xem_gio_hang

- rule: Chọn dòng giỏ hàng để đổi số lượng
  steps:
    - intent: chon_dong_gio_hang
    - action: action_chon_dong_gio_hang

- rule: Cập nhật số lượng giỏ hàng
  steps:
    - intent: cap_nhat_so_luong_gio_hang
    - action: action_cap_nhat_so_luong_gio_hang

- rule: Xóa 1 sản phẩm khỏi giỏ
  steps:
    - intent: xoa_san_pham_gio_hang
    - action: action_xoa_san_pham_gio_hang

- rule: Xóa toàn bộ giỏ hàng
  steps:
    - intent: xoa_toan_bo_gio_hang
    - action: action_xoa_toan_bo_gio_hang

- rule: Xem chi tiết sản phẩm
  steps:
    - intent: xem_chi_tiet_san_pham
    - action: action_xem_chi_tiet_san_pham

- rule: Xem sản phẩm trên Web
  steps:
    - intent: goto_product_details
    - action: action_goto_product_details

# — Đơn hàng + voucher —
- rule: Xem đơn hàng của tôi
  steps:
    - intent: xem_don_hang_cua_toi
    - action: action_xem_don_hang

- rule: Tìm đơn hàng theo sản phẩm
  steps:
    - intent: tim_don_hang_theo_san_pham
    - action: action_tim_don_hang_theo_san_pham

- rule: Xác nhận tìm đơn hàng theo sản phẩm
  steps:
    - intent: xac_nhan_tim_don
    - action: action_xac_nhan_tim_don

- rule: Xem chi tiết đơn
  steps:
    - intent: xem_chi_tiet_don
    - action: action_chi_tiet_don

- rule: Xem đơn hàng vừa mới đặt
  steps:
    - intent: xem_don_hang_vua_dat
    - action: action_xem_don_hang_vua_dat

- rule: Hỏi ngày đặt mua đơn hàng
  steps:
    - intent: hoi_ngay_dat_don
    - action: action_hoi_ngay_dat_don

- rule: Hỏi ngày giao đơn hàng
  steps:
    - intent: hoi_ngay_giao_don
    - action: action_hoi_ngay_giao_don

- rule: Hỏi giá và tổng tiền đơn hàng
  steps:
    - intent: hoi_gia_tong_tien_don
    - action: action_hoi_gia_tong_tien_don

- rule: Hỏi số lượng sản phẩm trong đơn hàng
  steps:
    - intent: hoi_so_luong_san_pham_don
    - action: action_hoi_so_luong_san_pham_don

- rule: Hỏi phương thức và trạng thái thanh toán đơn hàng
  steps:
    - intent: hoi_thanh_toan_phuong_thuc_don
    - action: action_hoi_thanh_toan_phuong_thuc_don

- rule: Hỏi thông tin người nhận và địa chỉ giao đơn hàng
  steps:
    - intent: hoi_thong_tin_nguoi_nhan_dia_chi
    - action: action_hoi_thong_tin_nguoi_nhan_dia_chi

- rule: Hỏi thời gian giao hàng
  steps:
    - intent: hoi_thoi_gian_giao_hang
    - action: utter_hoi_thoi_gian_giao_hang

# — Tài khoản —
- rule: Hướng dẫn mua hàng
  steps:
    - intent: huong_dan_mua_hang
    - action: utter_huong_dan_mua_hang

- rule: Hướng dẫn thanh toán
  steps:
    - intent: huong_dan_thanh_toan
    - action: utter_huong_dan_thanh_toan

- rule: Xem địa chỉ
  steps:
    - intent: xem_dia_chi
    - action: action_xem_dia_chi

- rule: Xem địa chỉ người khác
  steps:
    - intent: xem_dia_chi_nguoi_khac
    - action: action_xem_dia_chi

- rule: Điều hướng trang địa chỉ
  steps:
    - intent: goto_address_page
    - action: action_goto_address_page

- rule: Điều hướng trang đăng nhập
  steps:
    - intent: goto_login_page
    - action: action_goto_login_page

- rule: Điều hướng trang đơn hàng
  steps:
    - intent: goto_orders_page
    - action: action_goto_orders_page


- rule: Hỏi thông tin và phân loại dịch vụ
  steps:
    - intent: hoi_dich_vu
    - action: action_hoi_dich_vu

- rule: Hướng dẫn đặt lịch hẹn
  steps:
    - intent: huong_dan_dat_lich
    - action: action_huong_dan_dat_lich

- rule: Điều hướng trang dịch vụ
  steps:
    - intent: goto_service_page
    - action: action_goto_service_page

- rule: Điều hướng trang đặt lịch
  steps:
    - intent: goto_booking_page
    - action: action_goto_booking_page

- rule: Xem lịch hẹn của tôi
  steps:
    - intent: xem_lich_hen_cua_toi
    - action: action_xem_lich_hen_cua_toi

- rule: Từ chối xem lịch hẹn người khác
  steps:
    - intent: xem_lich_hen_nguoi_khac
    - action: action_xem_lich_hen_cua_toi

- rule: Điều hướng trang lịch hẹn cá nhân
  steps:
    - intent: goto_my_appointments_page
    - action: action_goto_my_appointments_page

- rule: Xem danh sách hồ sơ thú cưng của tôi
  steps:
    - intent: xem_danh_sach_thu_cung
    - action: action_xem_danh_sach_thu_cung

- rule: Từ chối xem hồ sơ thú cưng người khác
  steps:
    - intent: xem_pet_nguoi_khac
    - action: action_xem_danh_sach_thu_cung

- rule: Điều hướng trang hồ sơ thú cưng
  steps:
    - intent: goto_my_pets_page
    - action: action_goto_my_pets_page

# — Bảo mật: từ chối xem đơn hàng người khác —
- rule: Từ chối xem đơn hàng của người khác
  steps:
    - intent: xem_don_hang_nguoi_khac
    - action: utter_tu_choi_xem_don_nguoi_khac

