responses:
  utter_greet:
    - text: "Xin chào! 🐾 Tôi là trợ lý ảo PetCenter.\nTôi có thể hỗ trợ bạn:\n• 📦 Tra cứu lịch sử & tìm kiếm sản phẩm trong đơn hàng\n• 🛍️ Khám phá sản phẩm hot, hàng mới & danh mục\n• 🩺 Tư vấn dịch vụ & đặt lịch hẹn chăm sóc thú cưng\n\nBạn cần tôi hỗ trợ thông tin gì hôm nay ạ?"

  utter_goodbye:
    - text: "Tạm biệt! Hẹn gặp lại bạn tại PetCenter 🐾 Cần hỗ trợ gì thêm cứ gọi tôi nhé!"

  utter_bot_challenge:
    - text: "Tôi là PetCenter Bot 🐾 - trợ lý AI thông minh của PetCenter, luôn sẵn sàng hỗ trợ bạn tra cứu đơn hàng, tư vấn sản phẩm và dịch vụ thú cưng 24/7!"

  utter_ask_bot_capabilities:
    - text: "Tôi là trợ lý AI của PetCenter! 🐾 Tôi có thể hỗ trợ bạn:\n• 📦 Tra cứu chi tiết & tìm kiếm sản phẩm trong đơn hàng đã mua\n• 🛍️ Xem sản phẩm bán chạy, hàng mới về & danh mục sản phẩm\n• 🛒 Quản lý giỏ hàng & áp dụng voucher ưu đãi\n• 🩺 Đặt lịch dịch vụ chăm sóc & xem sổ y tế thú cưng\n\nLưu ý: Tôi hỗ trợ thông tin và tra cứu dữ liệu 24/7, công đoạn giao hàng thực tế sẽ do shipper của PetCenter phụ trách bạn nhé! 🚚"

  utter_ask_human:
    - text: "Bạn có thể liên hệ trực tiếp với bộ phận chăm sóc khách hàng của PetCenter qua:\n📞 Hotline: +84 123 456 789\n✉ Email: support@petcenter.com\n\n💬 Ngoài ra, bạn có thể nhắn tin trực tiếp với staff hoặc admin ngay trên trang web — bấm vào nút Chat 💬 (khác với chat AI này) ở góc màn hình để được tư vấn trực tiếp bởi nhân viên PetCenter nhé!"

  utter_khong_hieu:
    - text: "Xin lỗi, tôi chưa hiểu ý bạn. Bạn thử hỏi: 'tìm thức ăn cho chó', 'đơn hàng của tôi', 'có voucher nào', 'dịch vụ spa'..."

  utter_out_of_scope:
    - text: "Xin lỗi, tôi là trợ lý mua sắm của PetCenter nên chưa hỗ trợ tính toán hoặc các câu hỏi ngoài phạm vi này. Bạn có thể hỏi tôi về sản phẩm chó mèo, đơn hàng hoặc dịch vụ nhé! 🐾"

  utter_gio_hang_trong:
    - text: "🛒 Giỏ hàng của bạn đang trống!\nHãy tìm kiếm sản phẩm để bắt đầu mua sắm nhé! 🐾"

  utter_da_them_vao_gio:
    - text: "✅ Đã thêm sản phẩm vào giỏ hàng thành công!\nBạn muốn tiếp tục mua sắm hay xem giỏ hàng?"

  utter_da_cap_nhat_so_luong:
    - text: "✅ Đã cập nhật số lượng thành công!\nBạn muốn xem lại giỏ hàng không?"

  utter_da_xoa_san_pham:
    - text: "✅ Đã xóa sản phẩm khỏi giỏ hàng!\nBạn muốn xem lại giỏ hàng không?"

  utter_xac_nhan_xoa_toan_bo:
    - text: "⚠️ Bạn có chắc chắn muốn xóa TOÀN BỘ sản phẩm trong giỏ hàng không? Hành động này không thể hoàn tác."

  utter_da_xoa_toan_bo:
    - text: "✅ Đã xóa toàn bộ giỏ hàng!\nBạn có muốn tìm sản phẩm mới không? 🐾"

  utter_loi_gio_hang:
    - text: "❌ Có lỗi xảy ra khi xử lý giỏ hàng. Vui lòng thử lại sau hoặc liên hệ hỗ trợ!"

  utter_chua_dang_nhap:
    - text: "🔐 Bạn cần đăng nhập để sử dụng giỏ hàng nhé!\nHãy đăng nhập và quay lại, tôi sẽ hỗ trợ bạn ngay!"

  utter_chua_chon_san_pham:
    - text: "⚠️ Bạn chưa chọn sản phẩm nào để thao tác. Hãy xem giỏ hàng và chọn sản phẩm trước nhé!"

  utter_so_luong_khong_hop_le:
    - text: "⚠️ Số lượng phải từ 1 đến 1000. Bạn muốn đặt bao nhiêu?"

  utter_yeu_cau_tu_khoa:
    - text: "Bạn muốn tìm sản phẩm gì? Ví dụ: thức ăn chó, đồ chơi mèo, vòng cổ..."

  utter_xem_gio_hang:
    - text: "Để xem giỏ hàng, bạn click vào icon 🛒 ở góc trên bên phải hoặc vào menu Profile > Cart nhé!"

  utter_hoi_thoi_gian_giao_hang:
    - text: "🚚 Thời gian giao hàng dự kiến:\n• Nội thành: 1 - 2 ngày làm việc.\n• Ngoại thành / Tỉnh khác: 3 - 5 ngày làm việc.\nBạn có thể kiểm tra trạng thái đơn hàng bất kỳ lúc nào nhé!"

  utter_hoi_phi_van_chuyen:
    - text: "📦 Phí vận chuyển tại PetCenter:\n• Đồng giá 20.000₫ cho đơn hàng nội thành.\n• Miễn phí giao hàng (FREESHIP) cho đơn hàng từ 500.000₫ trở lên!"

  utter_hoi_chinh_sach_doi_tra:
    - text: "🔄 Chính sách đổi trả sản phẩm:\n• Hỗ trợ đổi trả trong vòng 7 ngày nếu sản phẩm lỗi do nhà sản xuất hoặc giao sai mẫu.\n• Sản phẩm đổi trả cần giữ nguyên tem mác và chưa qua sử dụng.\nLiên hệ Hotline +84 123 456 789 để được hỗ trợ nhanh nhất!"

  utter_tu_choi_xem_don_nguoi_khac:
    - text: "🔒 Vì lý do bảo mật và quyền riêng tư, tôi chỉ có thể hiển thị đơn hàng của tài khoản đang đăng nhập — tức là đơn hàng của chính bạn.\n\nNếu muốn tra cứu đơn của người khác, họ cần tự đăng nhập vào tài khoản của mình để xem nhé! 🐾\n\nBạn có muốn xem đơn hàng của mình không?"

  utter_huong_dan_mua_hang:
    - text: "🛍️ **HƯỚNG DẪN MUA HÀNG TẠI PETCENTER**\n\nĐể đặt mua sản phẩm nhanh chóng trên Website, bạn thực hiện theo các bước sau:\n\n1️⃣ **Tìm & Chọn sản phẩm:** Khám phá sản phẩm trên Trang chủ hoặc tìm theo Danh mục / Thương hiệu.\n2️⃣ **Xem chi tiết:** Bấm chọn sản phẩm để xem thông tin chi tiết, giá cả và đánh giá từ khách hàng.\n3️⃣ **Thêm vào giỏ:** Bấm nút **\"🛒 Add to Cart\"** để thêm sản phẩm vào giỏ hàng.\n4️⃣ **Kiểm tra giỏ hàng:** Bấm vào **Tên tài khoản** ở góc trên bên phải màn hình ➔ Chọn **\"🛒 Cart\"** ➔ Tích chọn sản phẩm cần mua và bấm **\"Checkout\"**.\n5️⃣ **Hoàn tất đặt hàng:** Chọn địa chỉ nhận hàng, chọn Voucher ưu đãi, chọn phương thức thanh toán và bấm **\"Place Order\"**.\n\n✨ *Đơn hàng của bạn sẽ được đóng gói và giao đến tận nơi nhanh chóng!* 🚚"

  utter_huong_dan_thanh_toan:
    - text: "💳 **HƯỚNG DẪN THANH TOÁN TẠI PETCENTER**\n\nPetCenter hỗ trợ các phương thức thanh toán linh hoạt và an toàn tại bước Checkout:\n\n💵 **1. Thanh toán khi nhận hàng (COD):**\n• Bạn chọn phương thức **COD (Cash on Delivery)** và bấm **\"Place Order\"**. Thanh toán tiền mặt trực tiếp cho shipper khi nhận hàng.\n\n🏦 **2. Thanh toán Online / Chuyển khoản Banking / VNPay:**\n• Chọn phương thức **Online / VNPay** và bấm **\"Place Order\"**.\n• Quét mã QR hiển thị trên màn hình hoặc chuyển khoản theo đúng cú pháp mã đơn hàng.\n• Hệ thống sẽ tự động xác nhận đơn hàng ngay khi giao dịch thành công.\n\n🔒 *Mọi giao dịch trên PetCenter đều được mã hóa bảo mật an toàn 100%!*"

