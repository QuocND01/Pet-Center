slots:
  tu_khoa:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tu_khoa

  so_luong:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: so_luong

  product_id_chon:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: product_id_chon

  product_name_chon:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: product_name_chon

  cart_detail_id_chon:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: cart_detail_id_chon

  danh_muc:
